name: Progress service CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify Maven
        run: ./mvnw --version

      - name: Run tests
        run: ./mvnw test

      - name: Build Docker image
        run: docker build -t progress-service:${{ github.sha }} .
