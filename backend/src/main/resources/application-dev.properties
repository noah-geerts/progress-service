# Web server, auth
spring.application.name=progress
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-7depnj7pxm3mr8iz.us.auth0.com/
server.port=3000

# Logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.security=DEBUG
spring.output.ansi.enabled=ALWAYS

# CORS
cors.allowed-origins=http://localhost:4100,http://localhost:3000

# DB
spring.datasource.url=jdbc:postgresql://localhost:5555/myappdb
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate